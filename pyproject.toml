[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-support-evidence"
version = "0.1.0"
description = "Code and artifacts for causal support-evidence experiments."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["support_evidence*"]
